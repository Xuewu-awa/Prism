<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>蓝图修改器</title>
    <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
    <main class="app-shell">
        <aside class="sidebar">
            <section class="panel hero-panel">
                <h1>蓝图修改器</h1>
                <label class="file-field">
                    <span>UE 版本</span>
                    <select id="engineVersionSelect">
                        <option value="UNKNOWN">自动识别 / 未知</option>
                        <option value="VER_UE4_27">UE 4.27</option>
                        <option value="VER_UE5_0">UE 5.0</option>
                        <option value="VER_UE5_1">UE 5.1</option>
                        <option value="VER_UE5_2">UE 5.2</option>
                        <option value="VER_UE5_3">UE 5.3</option>
                        <option value="VER_UE5_4">UE 5.4</option>
                        <option value="VER_UE5_5">UE 5.5</option>
                        <option value="VER_UE5_6">UE 5.6</option>
                        <option value="VER_UE5_7">UE 5.7</option>
                        <option value="VER_UE5_8">UE 5.8</option>
                    </select>
                </label>
                <label class="file-field">
                    <span>选择 uasset（可同时多选 uexp/usmap）</span>
                    <input id="assetFilesInput" type="file" accept=".uasset,.uexp,.usmap,.jmap,.gz" multiple>
                </label>
                <label class="file-field">
                    <span>选择资产目录（可选）</span>
                    <input id="assetDirectoryInput" type="file" webkitdirectory multiple>
                </label>
                <label class="file-field">
                    <span>单独导入 usmap（可选）</span>
                    <input id="usmapInput" type="file" accept=".usmap,.jmap,.gz">
                </label>
                <button id="openAssetButton" class="primary">打开资产</button>
            </section>

            <section class="panel export-panel">
                <div class="panel-title">
                    <h2>导出列表</h2>
                    <button id="refreshGraphButton" title="刷新节点图">刷</button>
                </div>
                <select id="exportSelect" size="8"></select>
            </section>

            <section class="panel library-panel">
                <div class="panel-title">
                    <h2>本地节点库</h2>
                    <button id="reloadLibraryButton" title="重新加载节点库">刷</button>
                </div>
                <input id="libraryFilter" type="search" placeholder="筛选 Owner 或函数名">
                <div id="libraryList" class="library-list"></div>
            </section>
        </aside>

        <section class="workspace">
            <header class="toolbar">
                <div class="toolbar-group">
                    <button id="addIntButton" title="添加整数节点">+ 整数</button>
                    <button id="addStringButton" title="添加字符串节点">+ 字符串</button>
                    <button id="addBoolButton" title="添加布尔节点">+ 布尔</button>
                    <button id="autoLayoutButton" title="自动整理节点">自动整理</button>
                    <button id="toggleSimplifiedButton" title="切换简化/完整字节码视图">简化视图</button>
                    <button id="deleteNodeButton" title="删除选中节点">删除</button>
                </div>
                <div class="toolbar-group">
                    <button id="applyGraphButton" class="primary" title="编译节点修改">应用</button>
                    <button id="saveAssetButton" title="保存并创建备份">保存</button>
                </div>
                <span id="statusText" class="status">尚未加载资产</span>
            </header>

            <div class="canvas-wrap">
                <svg id="wireLayer" class="wire-layer"></svg>
                <div id="nodeLayer" class="node-layer"></div>
            </div>
        </section>

        <aside class="inspector">
            <section class="panel">
                <h2>属性检查器</h2>
                <div id="inspectorEmpty" class="empty-state">选择一个节点</div>
                <form id="inspectorForm" class="inspector-form hidden">
                    <label>
                        <span>标题</span>
                        <input id="nodeTitleInput" type="text">
                    </label>
                    <label>
                        <span>Owner</span>
                        <input id="nodeOwnerInput" type="text">
                    </label>
                    <label>
                        <span>函数</span>
                        <input id="nodeFunctionInput" type="text">
                    </label>
                    <label>
                        <span>表达式</span>
                        <input id="nodeExpressionInput" type="text">
                    </label>
                    <label>
                        <span>值</span>
                        <input id="nodeValueInput" type="text">
                    </label>
                    <label>
                        <span>Payload</span>
                        <textarea id="nodePayloadInput" spellcheck="false"></textarea>
                    </label>
                    <button id="updateNodeButton" type="submit" class="primary">更新节点</button>
                </form>
            </section>

            <section class="panel template-comment-panel">
                <h2>节点库注释</h2>
                <div id="templateEditorEmpty" class="empty-state">选择节点库模板</div>
                <form id="templateEditorForm" class="inspector-form hidden">
                    <label>
                        <span>模板</span>
                        <input id="templateNameInput" type="text" readonly>
                    </label>
                    <label>
                        <span>节点注释</span>
                        <textarea id="templateCommentInput" spellcheck="false" placeholder="说明这个节点的用途、限制或使用建议"></textarea>
                    </label>
                    <div id="pinCommentList" class="pin-comment-list"></div>
                    <div class="button-row">
                        <button id="saveTemplateCommentButton" type="submit" class="primary">保存注释</button>
                        <button id="addTemplateNodeButton" type="button">加入图中</button>
                    </div>
                </form>
            </section>

            <section class="panel">
                <h2>消息</h2>
                <div id="messages" class="messages"></div>
            </section>
        </aside>
    </main>

    <script src="/app/app.js"></script>
</body>
</html>
